version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creator_backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creator_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
